# Builds and tests every push and pull request. Pushing a tag such as v0.1.0 also publishes the
# release package (set the same version in Directory.Build.props first).
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the frontend's packages
        run: npm ci --prefix web

      - name: Lint the frontend
        run: npm run lint --prefix web

      - name: Test
        run: dotnet test WdsWeb.slnx

      - name: Build the release package
        shell: pwsh
        run: ./build/Build-Release.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: artifacts/*.zip

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
