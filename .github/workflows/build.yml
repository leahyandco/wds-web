# Builds and tests every push and pull request. Pushing a tag such as v0.1.0 also publishes a GitHub
# release with the package attached; set the same version in Directory.Build.props first.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = ([xml](Get-Content -Raw Directory.Build.props)).Project.PropertyGroup.Version
          if ("v$version" -ne '${{ github.ref_name }}') {
              throw "The tag is ${{ github.ref_name }}, but Directory.Build.props says $version."
          }

      - name: Install the frontend's packages
        run: npm ci --prefix web

      - name: Lint the frontend
        run: npm run lint --prefix web

      - name: Test
        run: dotnet test WdsWeb.slnx

      - name: Build the release package
        shell: pwsh
        run: ./build/Build-Release.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: release-package
          path: artifacts/*.zip

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $package = (Get-Item artifacts/*.zip).FullName
          gh release create '${{ github.ref_name }}' $package --title 'WDS Console ${{ github.ref_name }}' --generate-notes --verify-tag
